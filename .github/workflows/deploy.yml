# Tên quy trình: Tự động triển khai Random Dice Ultra V12
name: Deploy Random Dice 2026

on:
  # Chạy khi push code lên nhánh chính
  push:
    branches: ["main", "master"] # Hỗ trợ cả 2 tên nhánh phổ biến

  # Cho phép chạy thủ công để fix lỗi không cập nhật
  workflow_dispatch:

# Thiết lập quyền hạn (Permissions) - BẮT BUỘC cho năm 2026
permissions:
  contents: read
  pages: write
  id-token: write

# Tối ưu hóa: Nếu Khang push liên tục, nó sẽ hủy bản cũ để chạy bản mới nhất
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Bước 1: Lấy code (Sử dụng v4 mới nhất 2026)
      - name: Checkout
        uses: actions/checkout@v4

      # Bước 2: Cấu hình môi trường Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Bước 3: Đóng gói (Sử dụng v3 mới nhất)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Triển khai từ thư mục gốc

      # Bước 4: Đẩy lên Server (Sử dụng v4 mới nhất)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
