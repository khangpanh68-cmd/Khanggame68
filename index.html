<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Random Dice V18.6 Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { 
            --p: #0f172a; --a: #f1c40f; --d: #ef4444; --s: #10b981; 
            --gm: #00ecff; --ultra: #f472b6; --premium: #ff00ea;
        }
        body { margin: 0; background: #020617; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        
        #mainMenu, #shopUI, #gmVIPUI, #gmAuthUI, #guideUI, #gameOverUI { 
            position: fixed; inset: 0; z-index: 10000; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%); 
        }
        
        .menu-card { 
            background: rgba(255,255,255,0.05); backdrop-filter: blur(25px); 
            padding: 25px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); 
            text-align: center; width: 92%; max-width: 400px;
        }

        .panel-full { background: #0f172a; border-radius: 25px; border: 2px solid var(--gm); width: 95%; height: 85vh; display: flex; flex-direction: column; padding: 15px; }
        
        .shop-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--gm); background: transparent; color: white; font-weight: bold; }
        .tab-on { background: var(--gm); color: #000; }

        .scroll-list { flex: 1; overflow-y: auto; padding-right: 5px; margin-bottom: 10px; }
        .item-row { 
            background: rgba(255,255,255,0.03); margin-bottom: 8px; padding: 12px; 
            border-radius: 12px; display: flex; align-items: center; justify-content: space-between; 
            border-left: 5px solid #444;
        }

        .btn-hd { width: 100%; padding: 15px; margin: 5px 0; border: none; border-radius: 15px; font-size: 15px; font-weight: 900; cursor: pointer; color: white; transition: 0.3s; }
        .btn-play { background: #10b981; }
        .btn-boss { background: linear-gradient(135deg, #ef4444, #991b1b); border: 1px solid var(--a); }
        .btn-gm-live { position: fixed; top: 12px; right: 12px; width: 42px; height: 42px; background: var(--premium); border-radius: 10px; z-index: 10001; display: flex; align-items: center; justify-content: center; font-weight: 900; }

        canvas { background: rgba(0,0,0,0.4); border-radius: 20px; display: block; margin: 0 auto; border: 1px solid rgba(255,255,255,0.1); }
        .header { position: absolute; top: 65px; width: 100%; display: flex; justify-content: space-around; z-index: 5; font-size: 14px; }
        #trashBin { position: fixed; bottom: 110px; right: 20px; width: 60px; height: 60px; background: rgba(239,68,68,0.2); border: 2px dashed var(--d); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; z-index: 100; }
        
        select, input { padding: 12px; border-radius: 10px; border: none; width: 100%; background: #1e293b; color: white; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="btn-gm-live" onclick="openAuth()">⚡</div>

    <div id="mainMenu">
        <div class="menu-card">
            <h1 style="color:var(--a); margin:0; font-size:30px;">RANDOM DICE</h1>
            <p style="color:var(--gm); letter-spacing: 2px; font-size: 10px;">V18.6 SKIN & BOSS EDITION</p>
            <button class="btn-hd btn-play" onclick="gameStart(false)">CHẾ ĐỘ THƯỜNG</button>
            <button class="btn-hd btn-boss" onclick="gameStart(true)">🔥 SĂN BOSS 🔥</button>
            <button class="btn-hd" style="background:#f59e0b" onclick="openShop()">CỬA HÀNG (500 MÓN)</button>
            <button class="btn-hd" style="background:rgba(255,255,255,0.1)" onclick="openUI('guideUI')">HƯỚNG DẪN</button>
        </div>
    </div>

    <div id="shopUI" style="display:none">
        <div class="panel-full">
            <div class="shop-tabs">
                <button id="tD" class="tab-btn tab-on" onclick="swTab('dice')">DICES (250)</button>
                <button id="tS" class="tab-btn" onclick="swTab('skin')">SKINS (250)</button>
            </div>
            <div id="lDice" class="scroll-list"></div>
            <div id="lSkin" class="scroll-list" style="display:none"></div>
            <button class="btn-hd" style="background:var(--d)" onclick="closeUI('shopUI')">QUAY LẠI</button>
        </div>
    </div>

    <div id="gmVIPUI" style="display:none">
        <div class="panel-full" style="border-color: var(--premium);">
            <h2 style="color:var(--premium); text-align:center;">GM CONSOLE</h2>
            <div class="scroll-list">
                <button class="btn-hd" style="background:var(--s)" onclick="sp+=1000000;upUI()">+1M SP</button>
                <button class="btn-hd" style="background:white; color:black" onclick="hp=999999;upUI()">BẤT TỬ HP</button>
                <select id="gmSel"></select>
                <button class="btn-hd" style="background:var(--premium)" onclick="gmS()">TRIỆU HỒI 7★</button>
            </div>
            <button class="btn-hd" style="background:#444" onclick="closeUI('gmVIPUI')">THOÁT</button>
        </div>
    </div>

    <div id="gameOverUI" style="display:none">
        <div class="menu-card">
            <h1 id="overTitle" style="color:var(--d)">THẤT BẠI!</h1>
            <p id="resTxt">Wave 1</p>
            <button class="btn-hd btn-play" onclick="re()">CHƠI LẠI</button>
            <button class="btn-hd" style="background:#444" onclick="location.reload()">VỀ MENU</button>
        </div>
    </div>

    <div id="gmAuthUI" style="display:none"><div class="menu-card"><h3>KEY ADMIN</h3><input type="password" id="gKey"><button class="btn-hd btn-play" onclick="cGM()">VÀO</button></div></div>
    <div id="guideUI" style="display:none"><div class="menu-card"><h3>HƯỚNG DẪN</h3><p>- Mua Skin trong Shop để tăng hiệu ứng.<br>- Chế độ Săn Boss sẽ cực khó.<br>- Dùng GM Tool để trải nghiệm xúc xắc mạnh nhất.</p><button class="btn-hd btn-play" onclick="closeUI('guideUI')">OK</button></div></div>

    <div id="trashBin">🗑️</div>

    <div class="header">
        <div style="color:var(--d)">❤️ <span id="hpV">1000</span></div>
        <div style="color:var(--s)">💎 <span id="spV">1000</span></div>
        <div style="color:var(--gm)">🌊 <span id="wV">1</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div style="display:flex; gap:10px; width:95%; margin:10px auto;">
        <button class="btn-hd" style="background: #f59e0b; flex:2;" onclick="spn()">TRIỆU HỒI (50 SP)</button>
        <button class="btn-hd" style="background: #1e293b; flex:1;" onclick="openShop()">SHOP</button>
    </div>

<script>
/** --- DATA 250 DICES & 250 SKINS --- **/
const dNames = ['Lửa','Băng','Gió','Sét','Độc','Sắt','Quang','Mìn','Nước','Đá','Gỗ','Cát','Bom','Kiếm','Thánh','Quỷ','Joker','Solar','Lunar','Titan','Neon','Galaxy','Shadow','Phoenix','Chaos','God','Mega','Nova','Void','Soul','Zero','Alpha','Sigma','Core','Pulse','Spark','Blaze','Frost','Storm','Earth','Tide','Light','Dark','Magic','Tech','Cyber','Inferno','Mythic','Ultra','Diamond'];
const dD = []; const sD = [];

for(let i=0; i<250; i++){
    let tier = i > 200 ? "Diamond VIP" : (i > 120 ? "Ultra" : "Thường");
    let bCol = i > 200 ? "#ff00ea" : (i > 120 ? "#f472b6" : "#444");
    let color = `hsl(${(i*23)%360}, 75%, 60%)`;
    dD.push({ id:i, name:dNames[i%dNames.length]+(Math.floor(i/dNames.length)+1), color:color, dmg:100+(i*40), price:500+(i*200), border:bCol });
    sD.push({ id:i, name:"Skin "+dD[i].name+" HD+", price:5000+(i*1500), owned:false });
}

/** --- VARS --- **/
let sp=1000, hp=1000, wave=1, frame=0, gR=false, isG=false, drag=-1, mx=0, my=0, eInW=0, mE=10, isW=false, bossMode=false;
const cvs=document.getElementById('gameCanvas'), ctx=cvs.getContext('2d');
cvs.width=350; cvs.height=380;
const sz=70, col=5, bY=130;
let board=Array(15).fill(null), enemies=[], bullets=[];

/** --- SHOP LOGIC --- **/
function openUI(id){ document.getElementById(id).style.display='flex'; }
function closeUI(id){ document.getElementById(id).style.display='none'; }
function swTab(t){
    document.getElementById('lDice').style.display = t==='dice'?'block':'none';
    document.getElementById('lSkin').style.display = t==='skin'?'block':'none';
    document.getElementById('tD').className = t==='dice'?'tab-btn tab-on':'tab-btn';
    document.getElementById('tS').className = t==='skin'?'tab-btn tab-on':'tab-btn';
}
function openShop(){
    openUI('shopUI');
    document.getElementById('lDice').innerHTML = dD.map(d => `
        <div class="item-row" style="border-left-color:${d.border}">
            <div><b style="color:${d.color}">${d.name}</b><br><small>Dmg: ${d.dmg}</small></div>
            <button onclick="buyD(${d.id})" style="background:var(--s); color:white; border:none; padding:8px 12px; border-radius:10px;">${d.price}</button>
        </div>`).join('');
    document.getElementById('lSkin').innerHTML = sD.map(s => `
        <div class="item-row">
            <div><b>${s.name}</b><br><small>Hào quang HD+</small></div>
            <button onclick="buyS(${s.id})" style="background:var(--premium); color:white; border:none; padding:8px 12px; border-radius:10px;">${s.owned?'ĐÃ CÓ':s.price}</button>
        </div>`).join('');
}
function buyD(id){ let e=board.indexOf(null); if(sp>=dD[id].price && e!=-1){ sp-=dD[id].price; board[e]={...dD[id], dots:1}; upUI(); } }
function buyS(id){ if(sp>=sD[id].price && !sD[id].owned){ sp-=sD[id].price; sD[id].owned=true; openShop(); upUI(); } }

function cGM(){ if(document.getElementById('gKey').value==="Khangpanh68"){ isG=true; closeUI('gmAuthUI'); openGM(); } }
function openAuth(){ isG?openGM():openUI('gmAuthUI'); }
function openGM(){ openUI('gmVIPUI'); document.getElementById('gmSel').innerHTML=dD.map(d=>`<option value="${d.id}">${d.name}</option>`).join(''); }
function gmS(){ let id=document.getElementById('gmSel').value; let e=board.indexOf(null); if(e!=-1){ board[e]={...dD[id], dots:7}; upUI(); } }
function upUI(){ document.getElementById('spV').innerText=Math.floor(sp); document.getElementById('hpV').innerText=Math.floor(hp); document.getElementById('wV').innerText=wave; }

/** --- ENGINE --- **/
function render(){
    if(!gR) return; requestAnimationFrame(render);
    frame++; ctx.clearRect(0,0,cvs.width,cvs.height);
    for(let i=0; i<15; i++){
        let x=(i%col)*sz, y=bY+Math.floor(i/col)*sz;
        ctx.strokeStyle="rgba(255,255,255,0.05)"; ctx.strokeRect(x+5,y+5,sz-10,sz-10);
        if(board[i] && i!==drag) drawD(x,y,board[i]);
    }
    
    if(!isW){
        let isB = bossMode || (wave % 10 === 0);
        if(isB){
            if(eInW < 1){
                let bHp = (1000 + wave*2000)*5;
                enemies.push({x:-60, y:60, hp:bHp, mH:bHp, s:0.5, boss:true, sz:60, color:`hsl(${(wave*45)%360},100%,50%)`});
                eInW++;
            }
        } else {
            if(frame % 100 === 0 && eInW < mE){
                enemies.push({x:-30, y:70, hp:400+wave*350, mH:400+wave*350, s:1.2+(wave*0.05), boss:false, sz:30, color:"#ef4444"});
                eInW++;
            }
        }
        if(eInW >= (isB?1:mE) && enemies.length===0) nW();
    }

    enemies=enemies.filter(e=>{
        e.x+=e.s;
        if(e.x>cvs.width){ hp-=(e.boss?200:50); upUI(); return false; }
        if(e.hp<=0){ sp+=e.boss?(800+wave*100):(30+wave); upUI(); return false; }
        ctx.fillStyle=e.color;
        if(e.boss) { ctx.shadowBlur=15; ctx.shadowColor=e.color; }
        ctx.beginPath(); ctx.roundRect(e.x,e.y,e.sz,e.sz,10); ctx.fill(); ctx.shadowBlur=0;
        ctx.fillStyle="white"; ctx.textAlign="center"; ctx.font="bold 12px Arial";
        ctx.fillText(Math.floor(e.hp), e.x+e.sz/2, e.y-8);
        return true;
    });

    board.forEach((d,i)=>{
        if(d && enemies.length>0 && frame%40===0){
            bullets.push({x:(i%col)*sz+sz/2,y:bY+Math.floor(i/col)*sz+sz/2,t:enemies[0],dmg:d.dmg*d.dots,c:d.color});
        }
    });

    bullets=bullets.filter(b=>{
        if(!enemies.includes(b.t)) return false;
        let dx=b.t.x+b.t.sz/2-b.x, dy=b.t.y+b.t.sz/2-b.y, dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<10){ b.t.hp-=b.dmg; return false; }
        b.x+=dx/dist*18; b.y+=dy/dist*18;
        ctx.fillStyle=b.c; ctx.beginPath(); ctx.arc(b.x,b.y,5,0,Math.PI*2); ctx.fill();
        return true;
    });
    if(drag!==-1) drawD(mx-35,my-35,board[drag]);
    if(hp<=0) eG();
}

function nW(){ isW=true; setTimeout(()=>{ wave++; eInW=0; mE+=2; isW=false; upUI(); },2000); }

function drawD(x,y,d){
    ctx.save();
    let ownedSkin = sD[d.id].owned;
    if(ownedSkin) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = d.color;
        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
    }
    ctx.fillStyle=d.color; ctx.beginPath(); ctx.roundRect(x+10,y+10,sz-20,sz-20,12); ctx.fill();
    if(ownedSkin) ctx.stroke();
    ctx.fillStyle="white"; ctx.textAlign="center"; ctx.font="bold 10px Arial";
    ctx.fillText(d.name,x+sz/2,y+sz/2-5);
    ctx.font="bold 18px Arial"; ctx.fillText("★".repeat(d.dots),x+sz/2,y+sz/2+16);
    ctx.restore();
}

function spn(){ let e=board.indexOf(null); if(sp>=50 && e!=-1){ sp-=50; let i=Math.floor(Math.random()*40); board[e]={...dD[i], dots:1}; upUI(); } }
function eG(){ gR=false; openUI('gameOverUI'); }
function re(){ sp=1000; hp=1000; wave=1; enemies=[]; bullets=[]; board.fill(null); closeUI('gameOverUI'); gR=true; upUI(); render(); }
function gameStart(mode){ bossMode=mode; closeUI('mainMenu'); gR=true; upUI(); render(); }

/** --- TOUCH --- **/
cvs.addEventListener('touchstart', e => {
    let r=cvs.getBoundingClientRect(); mx=e.touches[0].clientX-r.left; my=e.touches[0].clientY-r.top;
    let i=Math.floor(mx/sz)+Math.floor((my-bY)/sz)*col;
    if(board[i]) drag=i;
});
cvs.addEventListener('touchmove', e => { if(drag===-1) return; e.preventDefault(); let r=cvs.getBoundingClientRect(); mx=e.touches[0].clientX-r.left; my=e.touches[0].clientY-r.top; });
cvs.addEventListener('touchend', e => {
    if(drag===-1) return;
    let ex=e.changedTouches[0].clientX, ey=e.changedTouches[0].clientY;
    let tR=document.getElementById('trashBin').getBoundingClientRect();
    if(ex>tR.left && ex<tR.right && ey>tR.top && ey<tR.bottom){ board[drag]=null; sp+=30; upUI(); }
    else {
        let t=Math.floor(mx/sz)+Math.floor((my-bY)/sz)*col;
        if(t!==-1 && t!==drag && board[t] && board[t].id===board[drag].id && board[t].dots===board[drag].dots && board[t].dots<7){ board[t].dots++; board[drag]=null; if(navigator.vibrate) navigator.vibrate(50); }
    }
    drag=-1;
});
</script>
</body>
</html>
