# Tên quy trình tự động hóa
name: Deploy Random Dice Ultra V12

on:
  # Chạy khi Khang đẩy code lên nhánh main
  push:
    branches: ["main"]

  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:

# Thiết lập quyền hạn cho GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Tránh xung đột luồng xử lý
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Bước 1: Lấy code mới nhất từ Repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bước 2: Thiết lập môi trường GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Bước 3: Đóng gói toàn bộ file (index.html, readme, ảnh...)
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Triển khai từ thư mục gốc
          path: '.'

      # Bước 4: Đẩy lên máy chủ web của GitHub
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
