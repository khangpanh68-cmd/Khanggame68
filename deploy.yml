name: Deploy V15

on:
  push:
    # Tự động chạy khi bạn push lên nhánh main hoặc master
    branches: ["main", "master"]
  
  # Cho phép kích hoạt thủ công từ tab Actions trên GitHub
  workflow_dispatch:

# Thiết lập quyền hạn tối ưu cho GitHub Pages 2026
permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo không bị xung đột khi deploy liên tục
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Triển khai toàn bộ file tại thư mục gốc (index.html)
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        
