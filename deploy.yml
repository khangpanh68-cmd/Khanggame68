name: Deploy Game Pro V9.1.3

on:
  push:
    branches: ["main"] # Nếu nhánh của Khang tên là master thì sửa main thành master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ÉP BUỘC CHẠY TRÊN NODE.JS 24 ĐỂ KHÔNG BỊ LỖI CẬP NHẬT
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Đẩy toàn bộ file trong thư mục hiện tại

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
