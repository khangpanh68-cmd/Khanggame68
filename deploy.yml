name: Deploy V18.6

on:
  push:
    # Tự động chạy khi Khang push code lên nhánh main hoặc master
    branches: ["main", "master"]
  
  # Cho phép Khang kích hoạt thủ công từ tab Actions trên GitHub
  workflow_dispatch:

# Thiết lập quyền hạn tối ưu cho GitHub Pages chuẩn 2026
permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo quy trình deploy mượt mà, không bị xung đột khi update liên tục
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        with:
          # Triển khai toàn bộ file tại thư mục gốc (nơi chứa index.html)
          path: '.'
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to Web
        id: deployment
        uses: actions/deploy-pages@v4
