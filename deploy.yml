name: Deploy Random Dice Ultra to Pages

on:
  # Tự động chạy khi Khang push code lên nhánh main
  push:
    branches: ["main"]

  # Cho phép Khang chạy thủ công từ tab Actions
  workflow_dispatch:

# Thiết lập quyền hạn để ghi đè lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo chỉ có một luồng deploy chạy tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy toàn bộ thư mục gốc (nơi chứa index.html)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
